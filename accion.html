<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu cuenta · Rayas Store</title>
<meta name="theme-color" content="#0a1230">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Cinzel:wght@700;900&family=Teko:wght@500;600&display=swap">
<link rel="stylesheet" href="estilos.css?v=24">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; position: relative; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; height: auto; z-index: -2;
    background: url("img/art-dota2.jpg") center / cover no-repeat;
    filter: saturate(1.1);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(255, 45, 143, .22), transparent 60%),
      linear-gradient(180deg, rgba(7, 13, 36, .42), rgba(7, 13, 36, .86));
  }
  .acc { width: min(100%, 460px); display: grid; gap: 18px; justify-items: center; }
  .acc-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .acc-brand img { width: 64px; height: 64px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 0 28px rgba(255, 45, 143, .45); }
  .acc-brand span { font: 900 28px/1 var(--title); letter-spacing: .08em; color: var(--yellow); }
  .acc-brand i { font-style: normal; color: var(--fuchsia); }
  .acc-card {
    width: 100%; padding: 2px;
    background: linear-gradient(135deg, var(--yellow), var(--line) 35%, var(--line) 65%, var(--fuchsia));
    clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
    filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .6));
  }
  .acc-in {
    padding: 30px 26px 26px; display: grid; gap: 16px;
    background: linear-gradient(180deg, var(--raised), var(--panel) 45%);
    clip-path: inherit;
  }
  .acc-kicker { font: 600 13px/1 var(--num); letter-spacing: .3em; text-transform: uppercase; color: var(--fuchsia); text-align: center; }
  .acc-in h1 { margin: 0; text-align: center; font: 900 clamp(26px, 6vw, 32px)/1.15 var(--title); color: var(--fg); }
  .acc-in h1 em { font-style: normal; color: var(--yellow); }
  .acc-in p { margin: 0; color: var(--muted); text-align: center; }
  .acc-in p b { color: var(--yellow); overflow-wrap: anywhere; }
  .acc-ico { width: 78px; height: 78px; margin: 0 auto; display: grid; place-items: center; font-size: 38px; border-radius: 50%; border: 2px solid var(--yellow); background: radial-gradient(circle, rgba(255, 201, 60, .22), transparent 70%); box-shadow: 0 0 30px rgba(255, 201, 60, .35); }
  .acc-ico.bad { border-color: var(--danger); background: radial-gradient(circle, rgba(255, 107, 107, .22), transparent 70%); box-shadow: 0 0 30px rgba(255, 107, 107, .35); }
  .acc-div { height: 1px; background: linear-gradient(90deg, transparent, var(--yellow), var(--fuchsia), transparent); opacity: .7; }
  .acc form { display: grid; gap: 14px; }
  .pw { position: relative; }
  .pw input { width: 100%; padding-right: 74px; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
  .pw button:hover { color: var(--yellow); border-color: var(--yellow); }
  .meter { height: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; transition: width .2s, background .2s; background: var(--danger); }
  .acc-msg { min-height: 1.3em; font-size: 14px; text-align: center; color: var(--danger); }
  .acc-msg.ok { color: var(--ok); }
  .acc .btn { width: 100%; }
  .acc-foot { font-size: 12px; color: var(--muted); text-align: center; }
  .acc-foot a { color: var(--yellow); }
  @media (max-width: 420px) { .acc-in { padding: 26px 18px 22px; } }
</style>
</head>
<body>
<main class="acc">
  <a class="acc-brand" href="/"><img src="img/logo.webp" alt="" width="64" height="64"><span>RAYAS <i>STORE</i></span></a>
  <div class="acc-card"><div class="acc-in" id="caja" aria-live="polite"><p>Cargando…</p></div></div>
  <p class="acc-foot">No afiliado a Valve. Dota 2 es una marca de Valve Corporation.</p>
</main>
<script src="accion.js?v=24"></script>

</body>
</html>
