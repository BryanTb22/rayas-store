<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1230">
<title>Bot de Steam · Rayas Store</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<style>
  :root { color-scheme: dark; --fondo: #0a1230; --fondo2: #0d1840; --texto: #f2f2f2; --acento: #ff8a1f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 10% -10%, rgba(255,138,31,.10), transparent 60%), var(--fondo); color: var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px;
         background: color-mix(in srgb, var(--fondo2) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.08); }
  .top h1 { margin: 0; font-size: 18px; letter-spacing: .03em; }
  .top h1 span { color: var(--acento); }
  .top a { color: inherit; text-decoration: none; font-size: 13px; padding: 8px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; }
  .top a:hover { border-color: var(--acento); }
  main { max-width: 1500px; margin: 0 auto; padding: 20px 24px 40px; }
  .aviso { max-width: 520px; margin: 12vh auto; text-align: center; padding: 28px; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
  .aviso a { color: var(--acento); }
  @media (max-width: 600px) { .top { padding: 12px 16px; } main { padding: 16px; } }
</style>
</head>
<body>
<header class="top">
  <h1>🤖 Bot de Steam · <span>Rayas Store</span></h1>
  <a href="./">← Volver a la tienda</a>
</header>
<main id="app"><div class="aviso">Cargando…</div></main>
<script src="bot-panel.js?v=2"></script>
<script>
(function () {
  "use strict";
  var FB = { apiKey: "AIzaSyDbyLi7IK3ikwUp7A0VzRRqPucqRXPpL3E", projectId: "litlejacob-store" };
  var SES_KEY = "rayas_admin_ses", ADMIN_UID = "eLEZkdXiG5b0PpxHQCCei8D0Qxy1";
  function leer() { try { return JSON.parse(localStorage.getItem(SES_KEY) || "null"); } catch (e) { return null; } }
  function guardar(s) { try { if (s) localStorage.setItem(SES_KEY, JSON.stringify(s)); else localStorage.removeItem(SES_KEY); } catch (e) { /* nada */ } }
  function uid(s) {
    if (!s) return null; if (s.uid) return s.uid;
    try { var p = JSON.parse(atob(s.id.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); return p.user_id || p.sub || null; } catch (e) { return null; }
  }
  function token() {
    var s = leer();
    if (!s) return Promise.reject(new Error("Tu sesión de administrador se cerró. Vuelve a entrar en la tienda."));
    if (s.exp > Date.now()) return Promise.resolve(s.id);
    return fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(FB.apiKey), {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(s.ref)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.id_token) { guardar(null); throw new Error("Tu sesión de administrador se cerró. Vuelve a entrar en la tienda."); }
      s.id = j.id_token; s.ref = j.refresh_token || s.ref; s.exp = Date.now() + (Number(j.expires_in) || 3600) * 1000 - 60000; guardar(s); return s.id;
    });
  }
  var app = document.getElementById("app");
  if (uid(leer()) !== ADMIN_UID) {
    app.innerHTML = '<div class="aviso"><h2>🔒 Solo para el administrador</h2><p>Inicia sesión como administrador en la tienda y vuelve a abrir esta página desde el <b>Panel admin → 🤖 Bot de Steam</b>.</p><p><a href="./">Ir a la tienda</a></p></div>';
    return;
  }
  window.BotPanel.montarPagina(app, { token: token, projectId: FB.projectId, acento: "#ff8a1f" });
})();
</script>
</body>
</html>
