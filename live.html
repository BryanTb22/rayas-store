<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rayas Store · Live</title>
<!--
  Carrusel de precios para el live de TikTok (26/11/2026).
  En TikTok LIVE Studio: Agregar fuente → "Enlace" → https://rayas.trade/live.html
  Lee los items de la web (Firestore rayas_items) y los vuelve a leer cada 5 minutos:
  si cambias un precio o el stock en el panel, el carrusel se actualiza solo.
  Muestra solo items activos con stock; si un item tiene varias versiones, sale una vez con el precio más bajo.
  Opciones en la dirección (opcionales, se juntan con &):
    ?seg=6          segundos por item (por defecto 6)
    ?rareza=ARCANO,INMORTAL   solo esas rarezas (ARCANO, INMORTAL, MITICO, LEGENDARIO, RARO…)
    ?min=20         solo items desde S/ 20 (por defecto desde S/ 10; ?min=0 muestra todos)
    ?max=100        solo items hasta S/ 100
    ?heroe=pudge    solo items de ese héroe (también vale parte del nombre)
    ?orden=azar     aleatorio (cada vuelta completa se vuelve a mezclar)
    ?orden=menor    de menos a más (del más barato al más caro)
    ?orden=mayor    de más a menos (del más caro al más barato) ← el de siempre si no se pone nada
    ?orden=nuevo    los últimos que se agregaron primero
    ?fondo=no       fondo transparente
    ?modo=barra     franja delgada (foto chica, nombre y precio) con fondo transparente, para poner
                    abajo encima del juego o la cámara. En LIVE Studio dale al cuadro forma de franja
                    (ej. 1080×220 en vertical, o 1280×130 en horizontal).
    ?steam=no       sin el precio de Steam ni el % de descuento
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --noche: #070d24; --panel: #0f1a3c; --naranja: #ff8a1f; --celeste: #3ec7ff; --fg: #eef1ff; --muted: #9ba7d8; --rz: #e4ae39; --rzs: rgba(228, 174, 57, .45);
  /* Tamaños según el cuadro (1vh = 1% del alto). Así funciona también en el navegador interno de TikTok LIVE Studio, que es antiguo */
  --cw: 1vw; --ch: 1vh; --cmin: 1vmin; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; color: var(--fg); font-family: Oswald, Impact, sans-serif;
  background: radial-gradient(ellipse at 30% 20%, #13214f, var(--noche) 70%); }
body.sinfondo { background: transparent; }
#escena { position: absolute; inset: 0; }
.slide { position: absolute; inset: 0; display: flex; align-items: center; gap: calc(4 * var(--cmin)); padding: calc(5 * var(--cmin)) calc(5 * var(--cmin)) calc(9 * var(--cmin));
  opacity: 0; transform: translateX(8%); transition: opacity .6s ease, transform .6s ease; }
.slide.on { opacity: 1; transform: none; transition-delay: .35s; }
.slide.fuera { opacity: 0; transform: translateX(-8%); transition-duration: .3s; transition-delay: 0s; }
.foto { position: relative; flex: 0 0 auto; width: min(58%, calc((calc(100 * var(--ch)) - calc(14 * var(--cmin))) * 1.5)); aspect-ratio: 3 / 2;
  border-radius: calc(2.5 * var(--cmin)); overflow: hidden; border: calc(.5 * var(--cmin)) solid var(--rz);
  background: radial-gradient(circle at 50% 40%, #1d2c5e, #0a1130 75%);
  box-shadow: 0 0 calc(4 * var(--cmin)) var(--rzs); }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.foto img.logo { object-fit: contain; padding: 12%; }
.foto em { position: absolute; left: calc(2 * var(--cmin)); bottom: calc(2 * var(--cmin)); font-style: normal; font-weight: 700;
  font-size: calc(4.2 * var(--cmin)); letter-spacing: calc(.3 * var(--cmin)); padding: calc(.3 * var(--cmin)) calc(2.4 * var(--cmin)); border-radius: calc(9 * var(--cmin)); color: #fff; background: #1a8a3a; }
.foto em.cd { background: #0a1130; border: calc(.3 * var(--cmin)) solid var(--celeste); color: var(--celeste); }
.dto { position: absolute; right: calc(2 * var(--cmin)); top: calc(2 * var(--cmin)); font-weight: 700; font-size: calc(5 * var(--cmin)); padding: calc(.2 * var(--cmin)) calc(2 * var(--cmin));
  border-radius: calc(1.5 * var(--cmin)); color: #fff; background: #e0202a; transform: rotate(4deg); box-shadow: 0 calc(.6 * var(--cmin)) calc(2 * var(--cmin)) rgba(0,0,0,.5); }
.texto { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(1.4 * var(--cmin)); }
.rz { align-self: flex-start; font-weight: 700; font-size: calc(4.6 * var(--cmin)); letter-spacing: calc(.8 * var(--cmin)); padding: calc(.2 * var(--cmin)) calc(2.5 * var(--cmin));
  border-radius: calc(9 * var(--cmin)); color: var(--noche); background: var(--rz); }
.heroe { color: var(--celeste); font-weight: 600; font-size: calc(5.5 * var(--cmin)); letter-spacing: calc(.5 * var(--cmin)); text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nom { font-weight: 700; font-size: calc(8.5 * var(--cmin)); line-height: 1.05; background: linear-gradient(#ffffff, #aab3d6);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.extra { color: #ffd2a8; font-weight: 500; font-size: calc(4.2 * var(--cmin)); letter-spacing: calc(.4 * var(--cmin)); text-transform: uppercase; }
.precio { font-weight: 700; font-size: calc(15 * var(--cmin)); line-height: 1.05; white-space: nowrap; color: var(--naranja);
  text-shadow: 0 0 calc(3 * var(--cmin)) rgba(255, 138, 31, .45); }
.precio small { font-size: .45em; color: var(--muted); text-shadow: none; margin-right: calc(1 * var(--cmin)); }
.steam { font-weight: 500; font-size: calc(4.6 * var(--cmin)); color: var(--muted); letter-spacing: calc(.2 * var(--cmin)); }
.steam s { text-decoration-thickness: calc(.4 * var(--cmin)); text-decoration-color: #e0202a; }
/* Cuadro alto o cuadrado (celular vertical): foto arriba, texto abajo */
@media (max-aspect-ratio: 7/5) {
  .slide { flex-direction: column; justify-content: center; text-align: center; gap: calc(2.5 * var(--cmin)); }
  .foto { width: min(100%, calc(calc(52 * var(--ch)) * 1.5)); }
  .texto { align-items: center; flex: 0 1 auto; }
  .rz { align-self: center; }
  .nom { font-size: calc(7 * var(--cmin)); -webkit-line-clamp: 2; }
  .precio { font-size: calc(12 * var(--cmin)); }
}
#pie { position: absolute; left: 0; right: 0; bottom: 0; height: calc(8 * var(--cmin)); display: flex; align-items: center; gap: calc(2 * var(--cmin));
  padding: 0 calc(4 * var(--cmin)); background: linear-gradient(90deg, rgba(7,13,36,.92), rgba(15,26,60,.92)); border-top: calc(.3 * var(--cmin)) solid var(--naranja); }
#pie img { height: calc(6.4 * var(--cmin)); width: calc(6.4 * var(--cmin)); border-radius: 50%; object-fit: cover; }
#pie b { font-weight: 700; font-size: calc(4.4 * var(--cmin)); letter-spacing: calc(.4 * var(--cmin)); color: var(--fg); }
#pie span { margin-left: auto; font-weight: 600; font-size: calc(4.2 * var(--cmin)); letter-spacing: calc(.3 * var(--cmin)); color: var(--celeste); white-space: nowrap; }
#barra { position: absolute; left: 0; bottom: calc(8 * var(--cmin)); height: calc(.7 * var(--cmin)); background: var(--naranja); width: 0; }
#aviso { position: absolute; inset: 0 0 calc(8 * var(--cmin)); display: flex; align-items: center; justify-content: center;
  font-size: calc(6 * var(--cmin)); color: var(--muted); letter-spacing: calc(.5 * var(--cmin)); text-align: center; padding: calc(5 * var(--cmin)); }
/* ===== Modo barra (?modo=barra): franja delgada para poner encima del juego o la cámara ===== */
body.barra { background: transparent; }
body.barra.confondo { background: var(--noche); }
.barra #pie { display: none; }
.barra #barra { bottom: calc(4 * var(--ch)); left: calc(3 * var(--ch)); height: calc(3 * var(--ch)); border-radius: calc(3 * var(--ch)); max-width: calc(100% - calc(6 * var(--ch))); }
.barra #aviso { top: auto; left: 0; right: 0; bottom: 0; height: calc(100 * var(--ch)); font-size: min(calc(28 * var(--ch)), calc(4 * var(--cw))); }
.barra .slide.b { top: auto; left: 0; right: 0; bottom: calc(4 * var(--ch)); height: calc(92 * var(--ch)); padding: 0 min(calc(4 * var(--ch)), calc(1.5 * var(--cw))) 0 0; gap: min(calc(5 * var(--ch)), calc(2 * var(--cw))); flex-direction: row; text-align: left;
  background: linear-gradient(90deg, rgba(7,13,36,.94), rgba(15,26,60,.9)); border: calc(.8 * var(--ch)) solid var(--rz); border-radius: calc(18 * var(--ch));
  overflow: hidden; transform: translateY(35%); box-shadow: 0 0 calc(6 * var(--ch)) var(--rzs); }
.barra .slide.b.on { transform: none; transition-delay: .35s; }
.barra .slide.b.fuera { transform: translateY(-35%); transition-duration: .3s; transition-delay: 0s; }
.b .bfoto { flex: 0 0 auto; height: 100%; aspect-ratio: 3 / 2; background: radial-gradient(circle at 50% 40%, #1d2c5e, #0a1130 75%); }
.b .bfoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.b .bfoto img.logo { object-fit: contain; padding: 10%; }
.b .bmid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(3 * var(--ch)); }
.b .blinea { display: flex; align-items: center; gap: min(calc(4 * var(--ch)), calc(1.5 * var(--cw))); min-width: 0; }
.b .rz { font-size: min(calc(13 * var(--ch)), calc(2.4 * var(--cw))); padding: calc(.5 * var(--ch)) min(calc(5 * var(--ch)), calc(1.6 * var(--cw))); letter-spacing: min(calc(1 * var(--ch)), calc(.3 * var(--cw))); flex: 0 0 auto; }
.b .heroe { font-size: min(calc(14 * var(--ch)), calc(2.6 * var(--cw))); min-width: 0; }
.b .nom { font-size: min(calc(24 * var(--ch)), calc(4.2 * var(--cw))); -webkit-line-clamp: 2; line-height: 1.05; }
.b .nom.largo { font-size: min(calc(19 * var(--ch)), calc(3.4 * var(--cw))); }
.b .bprecio { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: calc(1 * var(--ch)); }
.b .precio { font-size: min(calc(40 * var(--ch)), calc(7.5 * var(--cw))); line-height: 1; }
.b .bsub { font-weight: 600; font-size: min(calc(13 * var(--ch)), calc(2.4 * var(--cw))); letter-spacing: calc(.2 * var(--cw)); color: var(--celeste); white-space: nowrap; }
.b .bsub i { font-style: normal; color: #fff; background: #e0202a; border-radius: calc(3 * var(--ch)); padding: 0 min(calc(3 * var(--ch)), calc(1 * var(--cw))); margin-right: min(calc(2 * var(--ch)), calc(.6 * var(--cw))); }
.b .blogo { flex: 0 0 auto; height: 62%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; }
</style>
</head>
<body>
<div id="escena">
  <div id="aviso">Cargando items…</div>
  <div id="barra"></div>
  <div id="pie"><img src="img/logo-v2.webp" alt=""><b>RAYAS STORE</b><span>rayas.trade</span></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const SEG = Math.max(2, Number(P.get('seg')) || 6);
const sinTildes = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const RAREZAS = sinTildes(P.get('rareza')).split(',').map((s) => s.trim()).filter(Boolean);
const MIN = P.has('min') && isFinite(parseFloat(P.get('min'))) ? parseFloat(P.get('min')) : 10;   // por defecto desde S/ 10
const MAX = Number(P.get('max')) || Infinity;
const HEROE = sinTildes(P.get('heroe'));
// Acepta también palabras sueltas: aleatorio / menos / mas
const ORDEN = { aleatorio: 'azar', random: 'azar', menos: 'menor', barato: 'menor', mas: 'mayor', 'más': 'mayor', caro: 'mayor' }[(P.get('orden') || '').toLowerCase()]
  || (P.get('orden') || 'mayor').toLowerCase();
const STEAM = P.get('steam') !== 'no';
if (P.get('fondo') === 'no') document.body.classList.add('sinfondo');
// Transparente de verdad: el fondo también está en <html>
const BARRA = P.get('modo') === 'barra';
if (BARRA) document.body.classList.add('barra');
if (BARRA && P.get('fondo') === 'si') document.body.classList.add('confondo');
if (P.get('fondo') === 'no' || (BARRA && P.get('fondo') !== 'si')) document.documentElement.style.background = 'transparent';
// Barra: siempre con forma de franja (alto máximo = 1/5 del ancho), pegada abajo, aunque el cuadro o la ventana sean altos.
// --ch pasa a ser 1% del alto de la franja (no de la ventana).
function medirBarra() {
  const alto = Math.min(innerHeight, innerWidth / 5);
  document.documentElement.style.setProperty('--ch', alto / 100 + 'px');
}
if (BARRA) { medirBarra(); addEventListener('resize', medirBarra); }

// ?debug=1 → muestra arriba la versión de esta página y qué navegador la abre (para revisar TikTok LIVE Studio)
const VERSION = 'v6 · 26/11 barra franja';
if (P.get('debug')) {
  const sup = (p, v) => { try { return CSS.supports(p, v) ? 'sí' : 'NO'; } catch (e) { return '?'; } };
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9;background:#000;color:#0f0;font:16px/1.4 monospace;padding:8px;white-space:pre-wrap';
  d.textContent = 'Página ' + VERSION + '\nNavegador: ' + navigator.userAgent + '\nCuadro: ' + innerWidth + ' x ' + innerHeight +
    '\nmin(): ' + sup('width', 'min(1px, 2px)') + ' · aspect-ratio: ' + sup('aspect-ratio', '3 / 2') + ' · inset: ' + sup('inset', '0') +
    ' · clip texto: ' + sup('-webkit-background-clip', 'text');
  document.body.appendChild(d);
}

const BASE = 'https://firestore.googleapis.com/v1/projects/litlejacob-store/databases/(default)/documents/';
const TC_STEAM = 3.85;   // el mismo tipo de cambio con el que la web muestra el precio de Steam
const COLORES = { 'ARCANO': '#ade55c', 'INMORTAL': '#e4ae39', 'LEGENDARIO': '#e455f5', 'MITICO': '#a37dff', 'RARO': '#6f8aff', 'POCO COMUN': '#7db3ec', 'COMUN': '#c3d2e3' };
const sol = (n) => 'S/ ' + (Math.round(Number(n) * 100) / 100).toFixed(2).replace(/\.00$/, '');   // igual que la web
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escena = document.getElementById('escena'), aviso = document.getElementById('aviso'), barra = document.getElementById('barra');

// Un documento de Firestore → item simple
function deDoc(d) {
  const f = d.fields || {}, s = (k) => (f[k] && f[k].stringValue) || '';
  const n = (k) => { const v = f[k]; return v ? Number(v.integerValue ?? v.doubleValue ?? 0) : 0; };
  return { nombre: s('nombre'), heroe: s('heroe'), rareza: s('rareza'), calidad: s('calidad'), img: s('img'),
    precio: n('precio'), stock: n('stock'), steamUsd: n('steamUsd'), activo: !(f.activo && f.activo.booleanValue === false),
    cooldown: (f.cooldownHasta && f.cooldownHasta.timestampValue) || '', creado: (f.creado && f.creado.timestampValue) || '' };
}
const enCd = (x) => x.cooldown && Date.parse(x.cooldown) > Date.now();

// Foto: las de Steam en su tamaño original (3:2); las subidas a la web ("fs:img-…") se piden a Firestore
const FOTOS = {};
function urlFoto(src) {
  if (/^fs:img-[\w-]+$/.test(src)) {
    const id = src.slice(3);
    if (!FOTOS[id]) FOTOS[id] = fetch(BASE + 'rayas/' + id).then((r) => r.ok ? r.json() : null)
      .then((d) => { const u = d && d.fields && d.fields.data && d.fields.data.stringValue; return /^data:image\//.test(u || '') ? u : ''; })
      .catch(() => '');
    return FOTOS[id];
  }
  if (/^https:\/\//.test(src)) return Promise.resolve(src.replace(/(steamstatic\.com\/economy\/image\/[^/]+)\/\d+fx\d+f?$/, '$1'));
  if (/^img\//.test(src)) return Promise.resolve(src);
  return Promise.resolve('');
}

// Espera a que la foto termine de bajar (hasta 5 s) para que la tarjeta no salga vacía.
// Si la de Steam en tamaño original falla, prueba la dirección tal como está guardada; si tampoco, sale el logo.
function bajar(u) {
  return new Promise((ok) => {
    if (!u) return ok(false);
    const im = new Image(), t = setTimeout(() => ok(true), 5000);
    im.onload = () => { clearTimeout(t); ok(true); }; im.onerror = () => { clearTimeout(t); ok(false); };
    im.src = u;
  });
}
async function fotoLista(src) {
  const u = await urlFoto(src);
  if (await bajar(u)) return u;
  if (u !== src && /^https:\/\//.test(src) && await bajar(src)) return src;
  return '';
}

function mezclar(l) {
  l = l.slice();
  for (let k = l.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [l[k], l[j]] = [l[j], l[k]]; }
  return l;
}

let items = [], i = -1, actual = null;

async function cargar() {
  try {
    const todos = [];
    let token = '';
    do {
      const r = await fetch(BASE + 'rayas_items?pageSize=300' + (token ? '&pageToken=' + encodeURIComponent(token) : ''), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      (j.documents || []).forEach((d) => todos.push(deDoc(d)));
      token = j.nextPageToken || '';
    } while (token && todos.length < 3000);

    // Solo lo que el cliente puede comprar, con los filtros de la dirección
    const ok = todos.filter((x) => x.activo && x.stock > 0 && x.precio > 0 && x.img && x.precio >= MIN && x.precio <= MAX &&
      (!RAREZAS.length || RAREZAS.includes(sinTildes(x.rareza))) &&
      (!HEROE || sinTildes(x.heroe + ' ' + x.nombre).includes(HEROE)));

    // Mismo item con varias versiones (gemas, estilos): una sola tarjeta con el precio más bajo (primero las libres)
    const grupos = new Map();
    for (const x of ok) {
      const k = sinTildes(x.nombre), g = grupos.get(k);
      if (!g) { grupos.set(k, { ...x, total: x.stock, precios: new Set([x.precio]) }); continue; }
      g.total += x.stock; g.precios.add(x.precio);
      const mejor = (enCd(g) && !enCd(x)) || (enCd(g) === enCd(x) && x.precio < g.precio);
      if (mejor) Object.assign(g, { precio: x.precio, img: x.img, cooldown: x.cooldown, steamUsd: x.steamUsd || g.steamUsd, calidad: x.calidad });
    }
    let lista = [...grupos.values()].map((g) => ({ ...g, desde: g.precios.size > 1 }));

    if (ORDEN === 'azar') lista = mezclar(lista);
    else if (ORDEN === 'menor') lista.sort((a, b) => a.precio - b.precio);
    else if (ORDEN === 'nuevo') lista.sort((a, b) => b.creado.localeCompare(a.creado));
    else lista.sort((a, b) => b.precio - a.precio);

    if (lista.length) {
      const antes = items[i] && sinTildes(items[i].nombre);
      items = lista; aviso.style.display = 'none';
      // Sigue desde el item que estaba en pantalla (no vuelve a empezar al actualizar)
      const pos = antes ? items.findIndex((x) => sinTildes(x.nombre) === antes) : -1;
      i = pos >= 0 ? pos : Math.min(i, items.length - 1);
    } else if (!items.length) aviso.textContent = 'No hay items para mostrar';
  } catch { if (!items.length) aviso.textContent = 'Sin conexión con la tienda… reintentando'; }
}

async function tarjeta(x) {
  const color = COLORES[sinTildes(x.rareza)] || '#c3d2e3';
  const sombra = 'rgba(' + [1, 3, 5].map((k) => parseInt(color.slice(k, k + 2), 16)).join(', ') + ', .4)';
  const steamSol = STEAM && x.steamUsd > 0 ? x.steamUsd * TC_STEAM : 0;
  const dto = steamSol && x.precio < steamSol ? Math.round((1 - x.precio / steamSol) * 100) : 0;
  const cd = enCd(x), fecha = cd ? new Date(x.cooldown) : null;
  const estado = cd ? `<em class="cd">ENTREGA ${String(fecha.getDate()).padStart(2, '0')}/${String(fecha.getMonth() + 1).padStart(2, '0')}</em>`
    : `<em>EN STOCK${x.total > 1 ? ' · ' + x.total : ''}</em>`;
  const extra = [x.calidad && !/^(standard|sta)$/i.test(x.calidad) ? x.calidad : '', x.desde ? 'Varias versiones' : ''].filter(Boolean).join(' · ');
  const foto = await fotoLista(x.img);
  const el = document.createElement('div');
  el.className = 'slide';
  if (BARRA) {
    el.className = 'slide b';
    el.style.setProperty('--rz', color); el.style.setProperty('--rzs', sombra);
    const sub = dto >= 5 ? `<i>-${dto}%</i>vs Steam` : cd ? `Entrega ${estado.replace(/<[^>]+>/g, '').replace('ENTREGA ', '')}` : 'rayas.trade';
    el.innerHTML = `<div class="bfoto"><img src="${esc(foto || 'img/logo-v2.webp')}"${foto ? '' : ' class="logo"'} alt=""></div>
      <div class="bmid"><div class="blinea">${x.rareza ? `<span class="rz">${esc(x.rareza)}</span>` : ''}${x.heroe ? `<span class="heroe">${esc(x.heroe)}</span>` : ''}</div>
        <div class="nom${x.nombre.length > 22 ? ' largo' : ''}">${esc(x.nombre)}</div></div>
      <div class="bprecio"><div class="precio">${x.desde ? '<small>desde</small>' : ''}${sol(x.precio)}</div><div class="bsub">${sub}</div></div>
      <img class="blogo" src="img/logo-v2.webp" alt="">`;
    return el;
  }
  el.style.setProperty('--rz', color); el.style.setProperty('--rzs', sombra);
  el.innerHTML = `<div class="foto"><img src="${esc(foto || 'img/logo-v2.webp')}"${foto ? '' : ' class="logo"'} alt="">${estado}${dto >= 5 ? `<span class="dto">-${dto}%</span>` : ''}</div>
    <div class="texto">${x.rareza ? `<span class="rz">${esc(x.rareza)}</span>` : ''}
      ${x.heroe ? `<div class="heroe">${esc(x.heroe)}</div>` : ''}
      <div class="nom">${esc(x.nombre)}</div>${extra ? `<div class="extra">${esc(extra)}</div>` : ''}
      <div class="precio">${x.desde ? '<small>desde</small>' : ''}${sol(x.precio)}</div>
      ${dto >= 5 ? `<div class="steam">En Steam <s>${sol(Math.round(steamSol))}</s></div>` : ''}</div>`;
  return el;
}

async function siguiente() {
  if (!items.length) return setTimeout(siguiente, 3000);
  i = (i + 1) % items.length;
  // Aleatorio: al terminar una vuelta completa se vuelve a mezclar (sin repetir el que acaba de salir)
  if (ORDEN === 'azar' && i === 0 && actual && items.length > 2) {
    const ultimo = items[items.length - 1];
    items = mezclar(items);
    if (items[0] === ultimo) items.push(items.shift());
  }
  const nuevo = await tarjeta(items[i]);
  escena.insertBefore(nuevo, barra);
  // Precarga la foto del que viene
  const prox = items[(i + 1) % items.length];
  if (prox) fotoLista(prox.img);
  requestAnimationFrame(() => requestAnimationFrame(() => nuevo.classList.add('on')));
  if (actual) { const viejo = actual; viejo.classList.remove('on'); viejo.classList.add('fuera'); setTimeout(() => viejo.remove(), 700); }
  actual = nuevo;
  barra.style.transition = 'none'; barra.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { barra.style.transition = `width ${SEG}s linear`; barra.style.width = '100%'; }));
  setTimeout(siguiente, SEG * 1000);
}

cargar().then(siguiente);
setInterval(cargar, 5 * 60 * 1000);
</script>
